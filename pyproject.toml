[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stark"
version = "0.0.0"
description = "STARK: Self-Taught, Auditable and Reversible Knowledge for Language Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
]

# ruff itself runs from .pre-commit-config.yaml; this is its configuration.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
