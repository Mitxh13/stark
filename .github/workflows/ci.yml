name: CI

on:
  pull_request:
    # `edited` re-checks the PR title and description when they change.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the attribution check reads every commit in the PR
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      # gitleaks only scans staged changes, so it is skipped here; GitHub's secret scanning
      # with push protection covers pushes.
      - name: pre-commit (hygiene, ruff, blocked paths, student IDs)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
      # Same rule as the commit-msg hook, for commits made without it and for the PR text.
      - name: No agent attribution in commits or the PR description
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          msg="$RUNNER_TEMP/message"
          check() {
            uv run --locked pre-commit run no-agent-attribution \
              --hook-stage commit-msg --commit-msg-filename "$msg"
          }
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$msg"
            check || { echo "::error::commit $sha credits a coding agent"; exit 1; }
          done
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$msg"
          check || { echo "::error::the PR title or description credits a coding agent"; exit 1; }
      # CPU only. The real exactness gates will run manually on a GPU.
      - name: pytest
        run: uv run --locked pytest
