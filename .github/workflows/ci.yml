name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      # gitleaks only scans staged changes, so it is skipped here; GitHub's secret scanning
      # with push protection covers pushes.
      - name: pre-commit (hygiene, ruff, blocked paths, student IDs)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
      # CPU only. The real exactness gates will run manually on a GPU.
      - name: pytest
        run: uv run --locked pytest
